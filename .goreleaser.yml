version: 2

project_name: komiku-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: komiku-cli
    main: ./cmd/komiku-cli
    binary: komiku-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/bangadam/komiku-cli/cli.Version={{ .Version }}

archives:
  - id: komiku-cli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
